name: Skeleton reliability checks

on:
  push:
    branches: [main, 'research/**']
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax and documentation links
        run: make check
      - name: Install audit test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy PyYAML pytest ruff
      - name: Lint audit code
        run: |
          ruff check BiLSTM/scripts/audit_pipeline_lock.py BiLSTM/tests/test_pipeline_lock.py
          ruff format --check BiLSTM/scripts/audit_pipeline_lock.py BiLSTM/tests/test_pipeline_lock.py
      - name: Test observation and snapshot integrity
        run: make test-audit
