base_config: paper_repro_tracker_v2.yaml
experiment: improved_v3_stride30

data:
  cache_in_memory: true

# Sliding window 60 frames with stride 30 generates ~5,395 training sequences
sequence:
  mode: sliding_window
  length: 60
  stride: 30
  short_clip_policy: interpolate

# Skeleton data augmentation per window (train only)
augmentation:
  enabled: true
  flip_prob: 0.5
  noise_std: 0.01
  rotation_range_deg: 5.0
  joint_dropout_prob: 0.05
  max_dropout_joints: 1
  random_shift_frames: 2

training:
  epochs: 100
  batch_size: 64
  optimizer:
    type: Adam
    learning_rate: 0.001
    weight_decay: 0.0
  loss:
    type: CrossEntropyLoss
  class_weighting: none
  gradient_clipping: 1.0

early_stopping:
  enabled: true
  patience: 15
  monitor: val_accuracy  # evaluates and stops at the clip-level
  mode: max

outputs:
  artifacts_dir: ./artifacts/improved_v3_stride30
  split_dir: ./artifacts/splits/paper_repro
  checkpoints_dir: ./checkpoints/improved_v3_stride30
  runs_dir: ./runs/improved_v3_stride30
